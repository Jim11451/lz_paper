name: Reproduce numerical benchmarks
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: reproducibility/requirements.txt
      - run: pip install -r reproducibility/requirements.txt
      - run: python reproducibility/reproduce.py verify
      - run: python reproducibility/reproduce.py benchmarks
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-benchmarks
          path: build/reproducibility/benchmarks.json
